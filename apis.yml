apis:
- aid: amex-gbt:egencia-user-sync-api
  name: Egencia User Sync API
  description: SCIM-based user provisioning for an Egencia corporate travel programme.
    Egencia's own overview states the API "supports SCIM, or System for Cross-domain
    Identity Management, an open standard that allows automating user provisioning
    using REST API and JSON" and that it "follows version 2.0 of the SCIM protocol".
    Three concurrent versions are published - /scim/v1/users, /scim/v2/Users and
    /scim/v3/Users - supporting create, retrieve, search, replace, patch and delete of
    traveller profiles, with an Egencia SCIM extension schema
    (urn:ietf:params:scim:schemas:extension:egencia:2.0:User) carrying companyId,
    singleSignOnId, arrangers, approvers and custom data fields. This is the most
    portable interface in the estate and the reason the interface shape is recorded as
    standard-plus-proprietary rather than proprietary.
  humanURL: https://www.amexglobalbusinesstravel.com/egencia-developer-center/api-details/user-sync-api
  baseURL: https://apis.egencia.com/openconnect/api
  tags:
  - Users
  - SCIM
  - Identity
  - Provisioning
  - Single Sign-On
  properties:
  - type: OpenAPI
    url: openapi/amex-gbt-user-sync-api-openapi.json
  - type: APIReference
    url: https://apis.egencia.com/openconnect/docs/api-docs/UserSyncAPI
  - type: Documentation
    url: https://apis.egencia.com/openconnect/v1/api-info?name=User
  - type: Authentication
    url: https://apis.egencia.com/auth/v1/token
- aid: amex-gbt:egencia-context-sso-api
  name: Egencia Context SSO API
  description: Single sign-on entry point that carries contextual data into the Egencia
    booking flow at authentication time. Documented endpoints are GET /v1/newTrip and
    GET /v2/startTrip, which accept trip context - origin, destination, dates and
    custom data fields such as TravelRequest, PurchaseOrder and MissionOrder - and
    pre-populate the search form and checkout, with that context flowing back out
    through the Expense SPI. This is the hand-off point between a customer's own
    intranet or travel-request system and the Egencia platform.
  humanURL: https://www.amexglobalbusinesstravel.com/egencia-developer-center/api-details/context-sso-api
  baseURL: https://apis.egencia.com/openconnect-sso-service
  tags:
  - Single Sign-On
  - Authentication
  - Context
  - Booking
  properties:
  - type: OpenAPI
    url: openapi/amex-gbt-sso-context-api-openapi.json
  - type: APIReference
    url: https://apis.egencia.com/openconnect-sso/docs/api-docs/sso
  - type: Documentation
    url: https://www.egencia.com/openconnect-sso-service/v1/api-info
- aid: amex-gbt:egencia-company-details-api
  name: Egencia Company Details API
  description: Retrieves company information for an Egencia corporate account - name,
    display name and related detail - plus e-commerce settings and an audit view of
    those settings. Documented operations are GET /v1/companies, GET
    /v1/companies/{company_id}, GET /v1/companies/ecommerce-settings and GET
    /v1/companies/ecommerce-settings/audit. The company_id it returns is an Egencia
    internal key, not an industry identifier.
  humanURL: https://www.amexglobalbusinesstravel.com/egencia-developer-center/api-details/company-info-api
  baseURL: https://apis.egencia.com/openconnect/api
  tags:
  - Company
  - Account
  - Configuration
  properties:
  - type: OpenAPI
    url: openapi/amex-gbt-company-info-api-openapi.json
  - type: APIReference
    url: https://apis.egencia.com/company/docs/api-docs/company-info-api
  - type: Documentation
    url: https://apis.egencia.com/company/v1/api-info?name=company-details
- aid: amex-gbt:egencia-company-cdf-api
  name: Egencia Company CDF API
  description: Manages custom data fields - the client-defined fields Egencia describes
    as capturing "invoicing, reporting, approval, billing" detail, commonly department,
    billing unit, reason for travel or project code. Documented operations cover GET
    /v1/companies/{companyId}/cdfs, list, create, replace and delete of CDF values
    under a definition, and PATCH of the value link. Custom data fields are a
    significant proprietary lock-in surface - a customer's own cost-allocation taxonomy
    is modelled inside Egencia's schema and keyed by Egencia definition and value IDs.
  humanURL: https://www.amexglobalbusinesstravel.com/egencia-developer-center/api-details/cdf-api
  baseURL: https://apis.egencia.com/openconnect/api
  tags:
  - Custom Data Fields
