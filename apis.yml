aid: amex-gbt
url: https://raw.githubusercontent.com/api-evangelist/amex-gbt/refs/heads/main/apis.yml
name: American Express Global Business Travel
kind: company
humanURL: https://www.amexglobalbusinesstravel.com/
description: American Express Global Business Travel (Amex GBT, NYSE GBTG, headquartered
  in New York) is the largest business-to-business travel platform in the world, operating
  in more than 140 countries under the Amex GBT, Egencia and Ovation brands, with CWT
  acquired in September 2025. Its home market is the United States. In the travel
  distribution chain Amex GBT is an intermediary rather than a supplier - a travel
  management company that aggregates air, hotel, rail, car and ground content sourced
  through the GDS layer, through NDC and through direct supplier connections, then
  resells it to corporate travel programmes with policy, approval, duty-of-care and
  reporting wrapped around it. It holds no inventory of its own, but it does hold the
  booking record, and that is where the switching cost lives. Its API posture is
  genuinely open at the documentation layer and firmly closed at the runtime layer.
  The Egencia Developer Center publishes thirteen named APIs and SPIs, and every one
  of them serves a real, anonymously retrievable OpenAPI 3.1.0 document from
  apis.egencia.com - no login, no key, no click-through. The identity surface is
  standards-based (SCIM 2.0 user provisioning over OAuth 2.0 client credentials); the
  booking, approval, expense, receipt, duty-of-care and reporting surfaces are
  proprietary Egencia shapes with no OpenTravel, HTNG or IATA NDC schema anywhere in
  them. Runtime access is customer-account gated - Egencia's own documentation states
  that "the values for client id and client secret will be provided to the Client
  after on-boarding to Egencia API platform", and every production endpoint returns
  401 to an anonymous caller. So - public contracts, gated runtime, a real documented
  bulk data export in the BI Transactions API, and API terms Egencia reserves the
  right to change in its sole discretion.
