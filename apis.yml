  - type: Documentation
    url: https://apis.egencia.com/openconnect/v1/api-info?name=Receipt
- aid: amex-gbt:egencia-duty-of-care-api
  name: Egencia Duty of Care API
  description: Traveller-tracking data for risk and duty-of-care programmes. Egencia
    documents POST https://apis.egencia.com/dutyofcare/api/v1/bookings to create a
    paginated query of booking data for a partner ID over a date range, then GET
    /v1/bookings/{resourceId} to page through the result. This is the surface a risk
    management vendor integrates against to locate travellers during a disruption.
  humanURL: https://www.amexglobalbusinesstravel.com/egencia-developer-center/api-details/doc-api
  baseURL: https://apis.egencia.com/dutyofcare/api
  tags:
  - Duty of Care
  - Traveler Tracking
  - Risk Management
  - Bookings
  properties:
  - type: OpenAPI
    url: openapi/amex-gbt-duty-of-care-api-openapi.json
  - type: APIReference
    url: https://apis.egencia.com/dutyofcare/docs/api-docs/doc-service
  - type: Documentation
    url: https://apis.egencia.com/dutyofcare/v1/api-info
- aid: amex-gbt:egencia-reporting-api
  name: Egencia Reporting API (BI Transactions)
  description: Consolidated booking transaction data out of Egencia, and the closest
    thing in the estate to a documented exit path. POST /v1/transactions creates a
    filtered report over a date range and returns pagination links; GET
    /v1/transactions/{reportId} pages the result. Line-of-business variants cover air,
    hotel, car, train, ground and fees, with segment, leg and ticketing detail. The
    response schemas carry portable industry identifiers - pnr and record_locator,
    marketing, operating and ticketing carrier codes, hotel_chain_code, ticket_code,
    confirmation_number and invoice_number - alongside Egencia's own
    itinerary_number. A separate GET /v1/egencia_iata returns the IATA agency code for
    a given point of sale, and an is_ndc flag records whether an air booking was made
    through NDC.
  humanURL: https://www.amexglobalbusinesstravel.com/egencia-developer-center/api-details/reporting-api
  baseURL: https://apis.egencia.com/bi/api
  tags:
  - Reporting
  - Business Intelligence
  - Transactions
  - Data Export
