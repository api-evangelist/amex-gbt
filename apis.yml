  - Cost Allocation
  - Reporting
  properties:
  - type: OpenAPI
    url: openapi/amex-gbt-company-cdf-api-openapi.json
  - type: APIReference
    url: https://apis.egencia.com/openconnect/docs/api-docs/CompanyCDFAPI
  - type: Documentation
    url: https://apis.egencia.com/openconnect/v1/api-info?name=CompanyCustomData
- aid: amex-gbt:egencia-validation-spi
  name: Egencia Validation SPI
  description: A service provider interface, not a consumable API - Egencia calls the
    customer. At checkout, when a traveller presses book, Egencia posts the booking
    payload to a web service the customer must build and implement, and the customer's
    response authorises or blocks the booking. The published contract is POST
    /v1/validateFields on https://apis.egencia.com/openconnect-validation-service. The
    integration burden sits on the customer's side, which is why an SPI raises
    switching cost even though the contract is published openly.
  humanURL: https://www.amexglobalbusinesstravel.com/egencia-developer-center/api-details/validation-spi
  baseURL: https://apis.egencia.com/openconnect-validation-service
  tags:
  - Validation
  - Booking
  - Policy
  - Webhook
  - SPI
  properties:
  - type: OpenAPI
    url: openapi/amex-gbt-validation-spi-openapi.json
  - type: APIReference
    url: https://apis.egencia.com/openconnect-validation/docs/api-docs/validation
  - type: Documentation
    url: https://www.egencia.com/openconnect-validation-service/v1/api-info
- aid: amex-gbt:egencia-expense-spi
  name: Egencia Expense SPI
  description: Near real-time push of booking and expense data out of Egencia into a
    customer's expense or ERP system. Egencia describes it as an "Expense capability"
    that pushes a message to a connected partner web service whenever a booking is
    created or updated, carrying either receipt or invoice information depending on
    company configuration, with retries if the consumer does not acknowledge. The
    published contract documents a subscription registration operation and the push
    payload. This is the principal outbound data path for a customer's own travel
    spend.
  humanURL: https://www.amexglobalbusinesstravel.com/egencia-developer-center/api-details/expense-spi
  baseURL: https://apis.egencia.com/openconnect-expensestream-service
  tags:
  - Expense
  - Bookings
  - Webhook
  - Notifications
  - SPI
  properties:
  - type: OpenAPI
    url: openapi/amex-gbt-expense-spi-openapi.json
  - type: APIReference
    url: https://apis.egencia.com/openconnect-expense/docs/api-docs/expense
  - type: Documentation
    url: https://www.egencia.com/openconnect-expensestream-service/v1/api-info
- aid: amex-gbt:egencia-get-booking-api
  name: Egencia Get Booking API
  description: Retrieval of a booking and its individual trip items, plus the receipts
    attached to an item. Documented operations are GET /v1/bookings/{bookingId}, GET
    /v1/bookings/{bookingId}/items/{itemId}, GET and v2 GET of item receipts, and the
    item-level cancel and delete actions. Paired with the Get Booking SPI push
    notification, which tells a partner system that a booking was created, updated or
    cancelled so it can fetch the detail. Booking and item identifiers are Egencia
    keys; the supplier PNR and record locator travel with the data.
  humanURL: https://www.amexglobalbusinesstravel.com/egencia-developer-center/api-details/booking-api
  baseURL: https://apis.egencia.com/openconnect/api
  tags:
  - Bookings
  - Trips
  - Receipts
  - Itinerary
  properties:
  - type: OpenAPI
    url: openapi/amex-gbt-booking-api-openapi.json
  - type: APIReference
    url: https://apis.egencia.com/openconnect/docs/api-docs/GetBookingAPI
  - type: Documentation
    url: https://apis.egencia.com/openconnect/v1/api-info?name=Booking
- aid: amex-gbt:egencia-cancellation-deletion-api
  name: Egencia Expense Cancellation and Deletion API
  description: Trip-level cancellation and deletion of bookings. Documented operations
    are POST /v1/bookings/{bookingId}/cancel and POST /v1/bookings/{bookingId}/delete,
    which act on every trip item in the booking and return a CANCELLED status per item
    or a FAILURE status with an error code. Item-level equivalents are documented on
    the Get Booking API.
  humanURL: https://www.amexglobalbusinesstravel.com/egencia-developer-center/api-details/cancel-delete-api
  baseURL: https://apis.egencia.com/openconnect/api
  tags:
  - Bookings
  - Cancellation
  - Servicing
  properties:
  - type: OpenAPI
    url: openapi/amex-gbt-cancellation-deletion-api-openapi.json
  - type: APIReference
    url: https://apis.egencia.com/openconnect/docs/api-docs/CancellationDeletionAPI
  - type: Documentation
    url: https://apis.egencia.com/openconnect/v1/api-info?name=CancelAndDelete
- aid: amex-gbt:egencia-approval-workflow-api
  name: Egencia Approval Workflow API
  description: Programmatic approval or denial of booking requests, at trip level and
    at trip-item level. Documented operations are POST
    /v1/bookings/{bookingId}/approve, /deny and the matching
    /items/{itemId}/approve and /deny. Egencia positions it as eliminating manual trip
    approval for individual travellers and groups.
  humanURL: https://www.amexglobalbusinesstravel.com/egencia-developer-center/api-details/approval-api
  baseURL: https://apis.egencia.com/openconnect/api
  tags:
  - Approvals
