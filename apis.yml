  - type: Documentation
    url: https://apis.egencia.com/openconnect/v1/api-info?name=Approval
- aid: amex-gbt:egencia-approval-customisation-spi
  name: Egencia Approval Customisation SPI
  description: An outbound service provider interface that lets a customer decide, at
    checkout time, whether level one and level two approval are required for a booking
    and who the approvers are. Egencia calls the customer's web service with the
    booking data and plugs the response into its own approval process. The published
    contract is POST /v1/custom-approval. As with the Validation SPI, the customer
    builds and hosts the implementation.
  humanURL: https://www.amexglobalbusinesstravel.com/egencia-developer-center/api-details/approval-customisation-spi
  baseURL: https://apis.egencia.com/openconnect/api
  tags:
