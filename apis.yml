  - type: Documentation
    url: https://www.egencia.com/openconnect-approval-service/v1/api-info
- aid: amex-gbt:egencia-receipt-api
  name: Egencia Receipt API
  description: Retrieval of the receipt for a booked trip item, via GET
    /v1/receipts/{itemId}, paired with a Receipt SPI that pushes a notification to a
    customer-built web service whenever a receipt is generated. The documented push
    payload carries booking_id, item_id, product_type, company_id, traveler_id,
    organization_parent_id and a HAL-style _links.receipt href back into the Egencia
    API - a clear illustration of how the record stays anchored to Egencia keys.
  humanURL: https://www.amexglobalbusinesstravel.com/egencia-developer-center/api-details/receipts-api
  baseURL: https://apis.egencia.com/openconnect/api
  tags:
  - Receipts
