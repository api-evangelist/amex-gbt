notes: >-
  Egencia does not publish a single site-wide changelog page. Each API carries its own dated
  change feed in the api_updates[] array of its api-info JSON document, which is what the
  Developer Center renders as the "Recent Updates" section on each API detail page. Those JSON
  documents are anonymously retrievable from apis.egencia.com even though the HTML pages that
  render them are behind a Cloudflare bot gate. The BI Transactions (Reporting) API carries by
  far the richest feed - 42 dated entries back to December 2023 - and is the only surface where
  Egencia tags entries "Breaking Change" and "Deprecation" and states removal timelines. The
  Duty of Care and Validation SPI feeds are effectively dormant. This is the recent window;
  the live api-info documents remain the source of truth.
scheme: >-
  Major version in the URI path (/v1/, /v2/, /v3/). Attribute-level additions and deprecations
  are shipped inside a major version and announced only through these dated feeds - there is no
  semantic version number, no release tag and no Sunset/Deprecation HTTP header.
