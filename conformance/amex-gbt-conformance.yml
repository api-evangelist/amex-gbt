source: >-
  all seventeen documents in openapi/, plus
  https://apis.egencia.com/openconnect/v1/api-info?name=User (SCIM conformance statement,
  verbatim) and https://apis.egencia.com/bi/v1/api-info
notes: >-
  Amex GBT's estate is standards-based exactly where identity and transport are concerned and
  proprietary everywhere the travel domain is concerned. There is no travel-industry schema
  anywhere in it - no OpenTravel/OTA, no HTNG, no IATA NDC message, no ONE Order, no Resolution
  787 offer/order model. NDC appears once, as the reporting boolean is_ndc. That is the expected
  posture for a travel management company rather than a supplier or aggregator, but it is worth
  recording explicitly because it is the single biggest driver of switching cost in this estate.
standards:
- id: openapi-3.1
  conforms: true
  evidence: All seventeen harvested documents declare "openapi":"3.1.0" and parse cleanly. Every
    one is retrievable anonymously from apis.egencia.com with no key and no click-through.
- id: oauth2
  conforms: true
  evidence: >-
    securitySchemes type oauth2 with a clientCredentials flow and tokenUrl
    https://apis.egencia.com/auth/v1/token in thirteen of the seventeen documents. Credentials
    are presented as HTTP Basic base64(client_id:client_secret); tokens are one hour.
- id: rfc6749-client-credentials
  conforms: true
  evidence: openapi securitySchemes flows.clientCredentials; documented token exchange in the BI
    Developer Guidelines.
- id: rfc8414-oauth-authorization-server-metadata
  conforms: partial
  evidence: >-
    https://www.egencia.com/.well-known/oauth-authorization-server returns 200 with RFC 8414
    metadata (issuer https://www.egencia.com/auth-service). That document describes the END-USER
    web authorization server (authorization_code + refresh_token, PKCE S256), NOT the
    machine-to-machine token endpoint the OpenAPIs declare. apis.egencia.com returns 404 for the
    same path - the API authorization server publishes no discovery document.
  artifact: well-known/amex-gbt-oauth-authorization-server.json
- id: rfc9728-oauth-protected-resource-metadata
  conforms: partial
  evidence: >-
    https://www.egencia.com/.well-known/oauth-protected-resource returns 200 (resource
    https://www.egencia.com). Again the web surface, not the API surface.
  artifact: well-known/amex-gbt-oauth-protected-resource.json
- id: oidc-discovery
