    urn:ietf:params:scim:api:messages:2.0:ListResponse and
    urn:ietf:params:scim:api:messages:2.0:Error - as is
    urn:ietf:params:scim:schemas:extension:enterprise:2.0:User. GET /v2/Schemas and
    GET /v2/Schemas/{id} provide SCIM schema discovery. Media type application/scim+json.
  paths: [/scim/v1/users, /scim/v2/Users, /scim/v3/Users, /v2/Schemas]
