- {from: Transaction, to: Booking, type: belongs_to, via: 'trip_id / itinerary_number'}
- {from: Transaction, to: IATACode, type: belongs_to, via: pos}
- {from: Company, to: Subscription, type: has_many, via: SubscriptionEntity}
identifier_portability:
  portable: [pnr, record_locator, confirmation_number, ticket_code, invoice_number, iata, marketing_airline, operating_carrier_segment, ticketing_carrier, carrier_code, airline_alliance, hotel_chain_code, flightDepartureIataCode, flightArrivalIataCode, carPickupIataCode, carDropoffIataCode, train_departure_city_rail_code, train_arrival_city_rail_code]
  non_portable: [company_id, organization_parent_id, traveler_id, userId, booking_id, trip_id, item_id, itinerary_number, definitionId, valueId, resourceId, reportId, record_id, comcode, tuid, partner_id]
  partial: [singleSignOnId, property_id, provider]
absent_entities:
  note: >-
    Recorded because their absence is the finding. There is no Offer, Order, Fare Quote, Shopping
    Session, Availability, Rate, Payment Instrument, Ticket Issuance, Loyalty Account, Content or
    Imagery entity anywhere in the estate. Booking happens in Egencia's own web checkout; the APIs
    govern who may book, under what codes, and what data comes back afterwards.
