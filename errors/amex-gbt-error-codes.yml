http_status_semantics:
- status: '400'
  meaning: 'Bad Request: Invalid input or request. On SCIM - request body cannot be read as it does not comply with expected schema.'
- status: '401'
  meaning: 'Unauthorized: authentication token empty, invalid or expired.'
- status: '403'
  meaning: 'Forbidden: user not validated for operation / insufficient permissions.'
- status: '404'
  meaning: Not Found.
- status: '415'
  meaning: Unsupported media type (CDF and SCIM write surfaces).
- status: '422'
  meaning: 'Invalid input: invalid or missing required input.'
- status: '500'
  meaning: 'Internal Server Error: unable to process request.'
- status: '501'
  meaning: Not Implemented (platform version/GDPR controllers).
- status: '503'
  meaning: Service Unavailable. Please try again later (SCIM User Sync).
