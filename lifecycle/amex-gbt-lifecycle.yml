deprecation:
  policy_url: null
  policy_page_published: false
  practice: >-
    Deprecation is real and observable but is announced only through the per-API dated change
    feeds (the api_updates[] arrays rendered as "Recent Updates" in the Developer Center), not
    through a standalone policy page. Entries are tagged "Deprecation" or "Breaking Change",
    name the affected attributes, and state a removal window ("We plan to remove this attribute
    after February 2026"). Notice periods observed in the feed run from roughly three months to
    just over a year, and Egencia has twice deferred an announced removal date rather than
    breaking consumers on schedule.
  evidence:
  - date: '2025-11-04'
    text: >-
      "We have deprecated an attribute from the Train endpoint under segment report level:
      'ticket_number' ... Please use ticket_code instead of ticket_number."
  - date: '2025-11-04'
    text: >-
      "We have deprecated an attribute from the Train endpoint: 'class_of_service_code'. We plan
      to remove this attribute after February 2026."
  - date: '2024-02-16'
    text: >-
      "Starting June 1st, 2024, we will remove over 100 deprecated data attributes to improve the
      reporting API's performance."
  - date: '2025-08-04 / 2025-10-24 / 2025-11-25 / 2026-04-14 / 2026-05-15 / 2026-06-15'
    text: >-
      Six separate advance notices for the same breaking change - limiting Reporting API
      historical extraction to 12 months per request - originally 2026-03-31, deferred to
      2026-07-01. This is the clearest evidence of a deliberate advance-notice practice.
  deferrals:
  - {announced: '2024-02-16', original: '2024-06-01', moved_to: '2024-08-01 then phased through 2024-10'}
  - {announced: '2025-08-04', original: '2026-03-31', moved_to: '2026-07-01'}
  sunset_header: false
  deprecation_header: false
  deprecated_in_openapi: false
  note: >-
    No operation in any of the seventeen harvested OpenAPI documents carries `deprecated: true`,
    and no RFC 8594 Sunset or Deprecation response header is declared anywhere. Deprecation in
