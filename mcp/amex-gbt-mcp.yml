agent_readiness_note: 'The contract side of agent readiness is unusually strong for a travel intermediary
  - seventeen valid OpenAPI 3.1.0 documents retrievable anonymously, so an agent or code generator can
  be built against the whole surface with no prior relationship. What blocks an agent is the runtime credential,
  not the contract: every production endpoint returns 401, credentials are issued only after commercial
  onboarding, and no machine-readable terms, rate limits or OAuth scopes are published, so an agent cannot
  check what it is permitted to do before calling.'
