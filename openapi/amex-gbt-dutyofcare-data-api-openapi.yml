        Each record will have multiple fields associated with it.'
      operationId: getBookings
      parameters:
      - description: Unique resource identifier returned from the POST /bookings response
        in: path
        name: resourceId
        required: true
        schema:
          type: string
      - description: page
        example: 1
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Duty_Of_Care_Response_Bean'
          description: '<b>OK</b> : duty of care booking data returned successfully'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Duty_Of_Care_Response_Bean'
          description: '<b>Bad Request</b> : request contains invalid values, e.g. non-numeric page parameter'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Duty_Of_Care_Response_Bean'
          description: '<b>Unauthorized</b> : <i>authentication token</i> empty, invalid or expired'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Duty_Of_Care_Response_Bean'
          description: '<b>Forbidden</b> : user do not have the permission to access data'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Duty_Of_Care_Response_Bean'
          description: '<b>Internal error</b> : no data, or other unexpected error'
      security:
      - OAuth2: []
      summary: Get the duty of care data as per the Request
      tags:
      - DutyOfCare Data
components:
  schemas:
    Rail_Segment_Details:
      properties:
        carrierCode:
          type: string
          description: Unique carrier code of the traveler’s carrier
        trainArrivalCityRailCode:
          type: string
          description: Arrival city rail code of the of traveler's train journey
        trainArrivalDatetime:
          type: string
          description: 'Arrival date-time of the traveler’s train journey in ISO 8601 format: YYYY-MM-DDTHH:MM:SS'
        trainArrivalLatitude:
          type: string
          description: Latitude of the train arrival location
        trainArrivalLongitude:
          type: string
          description: Longitude of the train arrival location
        trainArrivalStationName:
          type: string
          description: Arrival station name of the traveler's train journey
        trainDepartureCityRailCode:
          type: string
          description: Departure city rail code of the traveler's train journey
        trainDepartureDatetime:
          type: string
          description: 'Departure date-time of the traveler’s train journey in ISO 8601 format: YYYY-MM-DDTHH:MM:SS'
        trainDepartureLatitude:
          type: string
          description: Latitude of the train departure location
        trainDepartureLongitude:
          type: string
          description: Longitude of the train departure location
        trainDepartureStationName:
          type: string
          description: Departure station name of the traveler's train journey
        trainNumber:
          type: string
          description: The number associated with a train for a segment
    Metadata_corresponding_to_a_request:
      description: Represents the Metadata information
      properties:
        currentPage:
          type: integer
          format: int32
          description: Indicates the current page
        pageLimit:
          type: integer
          format: int32
          description: Indicates the Page Size for the request
        totalPages:
          type: integer
          format: int32
          description: Indicates the total number of expected pages
        totalRecords:
          type: integer
          format: int32
          description: Indicates the toal number of records for the request
    Traveler_Details:
      properties:
        customDataFields:
          type: array
          description: Custom data fields
          items:
            $ref: '#/components/schemas/Custom_Data_Fields'
        email:
          type: string
          description: Email address of the person for whom the travel booking was made
        firstName:
          type: string
          description: First Name of the person for whom the travel booking was made
        lastName:
          type: string
          description: Last Name of the person for whom the travel booking was made
        phone:
          type: string
          description: Phone number of the person for whom the travel booking was made
    Custom_Data_Fields:
      description: Custom data fields
      properties:
        name:
          type: string
          description: Name of the Custom Data Fields as configured for the company
        value:
          type: string
          description: The values provided will be retrieved for the corresponding fields, if they are available
    Duty_Of_Care_Response_Bean:
      description: Represents the API model for Doc service Public response
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        metadata:
          $ref: '#/components/schemas/Metadata_corresponding_to_a_request'
        recordList:
          type: array
          description: List of records
          items:
            $ref: '#/components/schemas/Doc_Records_List'
    Doc_Records_List:
      description: Contains the records in duty of care
      properties:
        airSegmentDetails:
          type: array
          items:
            $ref: '#/components/schemas/Air_Segment_Details'
        bookingReference:
          type: string
          description: Unique identifier of a booking
        bookingStatus:
          type: string
          description: 'Represents the status of the booking Example: Confirmed or Cancelled'
        carSegmentDetails:
          type: array
          items:
            $ref: '#/components/schemas/Car_Segment_Details'
        companyId:
          type: integer
          format: int32
          description: Unique Identifier for the company
        gdsReference:
          type: string
          description: GDS Identifier of a booking
        hotelSegmentDetails:
          type: array
          items:
            $ref: '#/components/schemas/Hotel_Segment_Details'
        lineOfBusiness:
          type: string
          description: 'The line of business for which the booking is associated with. Example: Air, Car, Train, Hotel'
        recordLocator:
          type: string
          description: Unique identifier for a record
        trainSegmentDetails:
          type: array
          items:
            $ref: '#/components/schemas/Rail_Segment_Details'
        travelerDetails:
          type: array
          items:
            $ref: '#/components/schemas/Traveler_Details'
        tripId:
          type: string
          description: A trip_id is a unique identifier generated by the system
    Hotel_Segment_Details:
      properties:
        hotelAddress:
          type: string
          description: Address of the hotel
        hotelCheckinDatetime:
          type: string
          description: Check in date-time in the local timezone of the hotel in ISO 8601 format:YYYY-MM-DDTHH:MM:SS
        hotelCheckoutDatetime:
          type: string
          description: 'Check out date-time in the local timezone of the hotel in ISO 8601 format: YYYY-MM-DDTHH:MM:SS'
        hotelLatitude:
          type: string
          description: Latitude of the hotel location
        hotelLongitude:
          type: string
          description: Longitude of the hotel location
        hotelName:
          type: string
          description: The name of the hotel
        hotelPhone:
          type: string
          description: Telephone number of the hotel
    Duty_of_Care_Request_Bean:
      description: DutyOfCareDataRequestBean Request
      properties:
        companyId:
          type: array
          description: Company ID is a Unique Identifier for the company
          items:
            type: integer
            format: int32
            description: Company ID is a Unique Identifier for the company
        endDateTime:
          type: string
          description: 'The end date-time to fetch the booking data in ISO 8601 format: YYYY-MM-DDTHH:MM:SSZ'
        partnerId:
          type: integer
          format: int32
          description: Unique identifier provided to partner by Egencia
        startDateTime:
          type: string
          description: 'The start date-time to fetch the booking data in ISO 8601 format: YYYY-MM-DDTHH:MM:SSZ'
    Link:
      properties:
        deprecation:
          type: string
        href:
          type: string
        hreflang:
          type: string
        media:
          type: string
        name:
          type: string
        profile:
          type: string
        rel:
          type: string
        title:
          type: string
        type:
          type: string
    Air_Segment_Details:
      properties:
        airlineCode:
          type: string
          description: Unique airline code to identify the traveler airline
        flightArrivalDatetime:
          type: string
          description: 'Actual flight arrival date-time in ISO 8601 format: YYYY-MM-DDTHH:MM:SS'
        flightArrivalIataCode:
          type: string
          description: Actual flight arrival IATA Code in standard format
        flightDepartureDatetime:
          type: string
          description: 'Actual flight departure date-time in ISO 8601 format: YYYY-MM-DDTHH:MM:SS'
        flightDepartureIataCode:
          type: string
          description: Actual flight departure IATA Code in standard format
        flightNumber:
          type: string
          description: Unique airline code for the particular flight
    Car_Segment_Details:
      properties:
        carDropoffDatetime:
          type: string
          description: 'Car drop-off date-time in ISO 8601 format: YYYY-MM-DDTHH:MM:SS'
        carDropoffIataCode:
          type: string
          description: IATA code of the Car drop off location
        carPickupDatetime:
          type: string
          description: 'Car pickup date-time in ISO 8601 format: YYYY-MM-DDTHH:MM:SS'
        carPickupIataCode:
          type: string
          description: IATA code of the Car pick up location
        carVendorCode:
          type: string
          description: Unique code of the car vendor
        carVendorName:
          type: string
          description: Name of the car vendor
  securitySchemes:
    OAuth2:
      flows:
        clientCredentials:
          tokenUrl: https://apis.egencia.com/auth/v1/token
      type: oauth2
