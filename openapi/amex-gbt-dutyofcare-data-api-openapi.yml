openapi: 3.2.0
info:
  title: Duty Of Care DutyOfCare Data API
  version: v1.0
servers:
- url: https://apis.egencia.com/dutyofcare/api
  description: Generated server url
tags:
- name: DutyOfCare Data
paths:
  /v1/bookings:
    post:
      description: 'In general, the DoC API uses HTTPs POST requests with JSON arguments and JSON responses. This API call allows the client to submit a request for retrieving paginated booking data for a specified search criterion.


        Request Parameters:


        Field

        Type

        Required/Optional

        Description


        partner_id


        Integer

        Required

        Unique identifier provided to partner by Egencia.


        company_id


        Integer

        Optional

        The company ID list. Company ID is a Unique Identifier for the company.


        start_date_time


        String

        Optional

        The date-time range to fetch the booking data. Timestamp in ISO 8601

        format: YYYY-MM-

        DDTHH:MM:SSZ Example: 2020-01-21T10:07:41.208Z.

        The date range should come as a pair.


        Future date is not allowed as start date.


        If the only start date-time is given, the range will be automatically set to next 24 hours from the start date-time.


        If the only end date-time is given, the range will be automatically set to last 24 hours from the end date-time.


        Missing both start and end date-time will be considered as the latest 24 hours.


        *Default timezone is GMT.


        end_date_time


        String

        Optional

        The date-time range to fetch the booking data. Timestamp in ISO 8601

        format: YYYY-MM-

        DDTHH:MM:SSZ Example: 2020-01-21T10:07:41.208Z.

        The date range should come as a pair.


        Future date is not allowed as start date.


        If the only start date-time is given, the range will be automatically set to next 24 hours from the start date-time.


        If the only end date-time is given, the range will be automatically set to last 24 hours from the end date-time.


        Missing both start and end date-time will be considered as the latest 24 hours.


        *Default timezone is GMT.


        Request Parameters:


        Success Response - 200 OK


        The request has succeeded. This endpoint will return metadata of the resource for the given request. If there is no content available or no more records available, it will return the below success messages.


        Response Code

        Description


        200


        200 OK; BOOKINGS_NOT_AVAILABLE("No bookings available for this particular request")


        200 OK; NO MORE BOOKING(“ All records have been fetched. No more bookings available for this request.”)


        Pagination Response


        This API will return the metadata (hyperlinks) of the resource from where you can fetch all the qualified booking records in a paginated manner. You can page through the resource by making a GET request to the NextPage URL provided in the paginated response. If there are no more pages, NextPage will be set to ‘null’.


        Response Parameter


        Attribute

        Type

        Description


        total_pages

        Integer

        Total Pages in the response.


        page_limit

        Integer

        The maximum number of records allowed in a single page.


        total_records

        Integer

        Total number of records in the response.


        Current_page

        Integer

        Page number of the displayed record..


        Examples:


        Consider a trip from Los Angeles to Dublin. The trip contains two flight booking from Los Angeles to Paris and Paris to Dublin. Also the trip contains a hotel booking in Dublin for 2 days.


        Trip Details


        company_id": "35067",


        Booking 1: Hotel booking


        Booking 2: Car booking


        In this booking there are 2 records. The hotel and car booking will be considered as two separate records.


        Note:


        The sample response is for reference purpose only.


        Sample Request


        curl ''https://apis.egencia.com/ dutyofcare/api/v1/bookings'' -X POST

        -H ''Content-Type: application/json;charset=UTF-8'' \

        -H ''Accept: application/json'' \

        -d ''{

        "partner_id" :"92",

        "company_id" :[35067],

        "start_date_time": "2020-06-21T00:00:11Z",

        "end_date_time": "2020-06-31T23:59:59Z"

        }''


        Sample Response


        {

        "metadata": {

        "total_pages": 5,

        "total_records" : 10,

        "page_limit" : 2,

        "current_page": 0

        },

        "_links": {

        "next": {

        "href": "https:// apis.egencia.com/dutyofcare/api /v1/bookings/89ef5828-6d9f-4429-ab73-5ee40cf7b4e7"

        }

        }

        }


        Fetching Duty of care data:


        This API will return all booking data for all the lob''s like FLIGHT, TRAIN, CAR and HOTEL'
      operationId: getDutyOfCareData
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Duty_of_Care_Request_Bean'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Duty_Of_Care_Response_Bean'
          description: '<b>OK</b> : booking data pulled successfully'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Duty_Of_Care_Response_Bean'
          description: '<b>Bad Request</b> : request body is malformed, or contains invalid values'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Duty_Of_Care_Response_Bean'
          description: '<b>Unauthorized</b> : <i>authentication token</i> empty, invalid or expired'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Duty_Of_Care_Response_Bean'
          description: '<b>Forbidden</b> : user do not have the permission to access data'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Duty_Of_Care_Response_Bean'
          description: '<b>Not found</b> : data which satisfying provided input details does not exist'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Duty_Of_Care_Response_Bean'
          description: '<b>Internal error</b> : no data, or other unexpected error'
      security:
      - OAuth2: []
      summary: Create Metadata based on the Search Request
      tags:
      - DutyOfCare Data
