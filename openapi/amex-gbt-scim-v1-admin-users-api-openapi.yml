.5em\">exactMatch</td>\n                    <td class=\"confluenceTd\" style=\"padding:0.5em\">\n                      <p>The possible values for exactMatch parameter are \"true\" and \"false\". The default value for this parameter is \"false\". This parameter can only be passed along with the mandatory parameters. If this parameter not passed in the query or set it as \"false\", then the search response contains resources with their values start with the required parameter. If it is \"true\", then the search response contains resources with exact value.</p>\n                    </td>\n                  </tr>\n                </tbody>\n              </table>\n            </div>\n            <a name=\"Bookmark38\"></a>\n            <h3 class=\"auto-cursor-target\" id=\"Bookmark38\">\n              <span class=\"nh-number\">3.4. </span>Email Type\n            </h3>\n            <div class=\"table-wrap\">\n              <table border=\"1\" class=\"wrapped confluenceTable\" style=\"border-collapse:collapse;font-size:1.0em\">\n                <colgroup>\n                  <col>\n                  <col>\n                </colgroup>\n                <tbody>\n                  <tr>\n                    <td class=\"confluenceTd\" style=\"padding:0.5em\">1</td>\n                    <td class=\"confluenceTd\" style=\"padding:0.5em\">WORK</td>\n                  </tr>\n                </tbody>\n              </table>\n            </div>\n          </div>\n        </div>\n      </div>\n    </div>\n    <script>\n      Split(['#sidebar', '#content'], {\n        sizes: [15, 85],\n        minSize: 100\n      });\n    </script>\n  </body>\n</html>"
