      tags:
      - scim-v1-admin-users
  /scim/v1/admin-users/{userName}:
    patch:
      description: '3.'
      operationId: patchAdmin
      parameters:
      - in: path
        name: userName
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimPatchSchema'
        required: true
      responses:
        '204':
          content:
            application/scim+json:
              schema:
