: rgb(0,0,0);\">Type</span>\n        </th>\n        <th class=\"confluenceTh\">\n          <span style=\"color: rgb(0,0,0);\">Required</span>\n        </th>\n        <th class=\"confluenceTh\">\n          <span style=\"color: rgb(0,0,0);\">Notes</span>\n        </th>\n      </tr>\n      <tr>\n        <td class=\"confluenceTd\">op</td>\n        <td class=\"confluenceTd\">\n          <span style=\"color: rgb(0,0,0);\">array[String]</span>\n        </td>\n        <td class=\"confluenceTd\">\n          <span style=\"color: rgb(0,0,0);\">Yes</span>\n        </td>\n        <td class=\"confluenceTd\">\n          <span style=\"color: rgb(0,0,0);\">\n            <br>\n          </span>\n        </td>\n      </tr>\n      <tr>\n        <td class=\"confluenceTd\">path</td>\n        <td class=\"confluenceTd\">\n          <br>\n        </td>\n        <td class=\"confluenceTd\">\n          <span style=\"color: rgb(0,0,0);\">Yes</span>\n        </td>\n        <td class=\"confluenceTd\">\n          <span style=\"color: rgb(0,0,0);\">\n            <br>\n          </span>\n        </td>\n      </tr>\n      <tr>\n        <td class=\"confluenceTd\">value</td>\n        <td class=\"confluenceTd\">\n          <span style=\"color: rgb(0,0,0);\">Object | <a href=\"#Create&amp;SearchAdminUserAPIContract-AdminUserRole\">AdminUserRole</a> | <a href=\"#Create&amp;SearchAdminUserAPIContract-PointOfSaleStatus\">PointOfSaleStatus</a>\n          </span>\n        </td>\n        <td class=\"confluenceTd\">\n          <span style=\"color: rgb(0,0,0);\">No</span>\n        </td>\n        <td class=\"confluenceTd\">\n          <span style=\"color: rgb(0,0,0);\">Type of the <strong>value</strong> attribute will always be depending upon the given operation. For example, in case of 'add' operation, value would be an object, for 'replace' operation, it would either be AdminUserRole or PointOfSaleStatus, and for 'remove' operation, it won't even be required. </span>\n        </td>\n      </tr>\n    </tbody>\n 