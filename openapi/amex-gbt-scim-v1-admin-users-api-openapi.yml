paths:
  /scim/v1/admin-users:
    get:
      description: '1.'
      operationId: getAllAdminUsers
      parameters:
      - description: 1-based index of the first query result
        in: query
        name: startIndex
        required: false
        schema:
          type: integer
          format: int32
      - description: Maximum number of query results per page
        in: query
        name: count
        required: false
        schema:
          type: integer
          format: int32
      - description: Status of the admin user
        in: query
        name: status
        required: false
        schema:
          type: string
          default: ACTIVE
      responses:
        '400':
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ListResponse'
          description: '<b>Bad Request</b> : Invalid input or request'
        '401':
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ListResponse'
          description: '<b>Unauthorized</b> : <i>Authentication token</i> empty, invalid or expired.'
        '403':
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ListResponse'
          description: '<b>Forbidden</b> : User is not authorized to perform this operation.'
        '422':
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ListResponse'
          description: '<b>Invalid input</b> : Invalid or missing required input.'
        '500':
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ListResponse'
          description: '<b>Internal Server Error</b> : Unable to process request.'
        '503':
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ListResponse'
          description: '<b>Service unavailable</b> : Unable to process request at the moment.'
      security:
      - OAuth2: []
      summary: Get all admin users in the system based on status
      tags:
      - scim-v1-admin-users
    post:
      description: '1.'
      operationId: createAdminUser
      requestBody:
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/UserSchema'
        required: true
      responses:
        '201':
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserSchema'
          description: <b>Created</b>.
        '400':
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserSchema'
          description: '<b>Bad Request</b> : Invalid input or request'
        '401':
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserSchema'
          description: '<b>Unauthorized</b> : <i>Authentication token</i> empty, invalid or expired.'
        '403':
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserSchema'
          description: '<b>Forbidden</b> : User is not authorized to perform this operation.'
        '422':
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserSchema'
          description: '<b>Invalid input</b> : Invalid or missing required input.'
        '500':
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserSchema'
          description: '<b>Internal Server Error</b> : Unable to process request.'
        '503':
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserSchema'
          description: '<b>Service unavailable</b> : Unable to process request at the moment.'
      security:
      - OAuth2: []
      summary: Create a new admin user in the system with the requested information
      tags:
      - scim-v1-admin-users
  /scim/v1/admin-users/search:
    post:
      description: '/*

