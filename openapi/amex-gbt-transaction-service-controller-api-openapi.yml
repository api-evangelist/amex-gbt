    Carbon_Emissions:
      description: Carbon Emission as per Air conversion factors (Source by DEFRA Produced by AEA for the Department of Energy and Climate Change (DECC) and the Department for Environment, Food and Rural Affairs (Defra))
      properties:
        carbon_emission_kg:
          type: string
          description: The carbon footprint generated by travel activities measured in kilograms according to organisational calculation standards. For Air, Hotel, and Train, if carbon calculation method is BEIS/DEFRA, CO2 emissions are calculated by multiplying the distance travelled or nights stayed with a DEFRA (Department for Environment, Food & Rural Affairs) conversion coefficient. A new coefficient is released every year around July or August, which is used to convert air and train business travel and hotel stays into kilograms (kgs) of greenhouse gas emissions. Coefficient used for calculating CO2 emissions is of the same year as the travel start year. For Car, CO2 g/km emissions are computed based on average by category and fuel type using ACRISS calculation method assuming 100 miles driven per rental day and converting it to kilograms (kgs) of greenhouse gas emissions.
        carbon_emission_lbs:
          type: string
          description: The carbon footprint generated by travel activities measured in pounds according to organisational calculation standards. For Air, Hotel, and Train, if carbon calculation method is BEIS/DEFRA, CO2 emissions are calculated by multiplying the distance travelled or nights stayed with a DEFRA (Department for Environment, Food & Rural Affairs) conversion coefficient. A new coefficient is released every year around July or August, which is used to convert air and train business travel and hotel stays into pounds (lbs) of greenhouse gas emissions. Coefficient used for calculating CO2 emissions is of the same year as the travel start year. For Car, CO2 g/km emissions are computed based on average by category and fuel type using ACRISS calculation method assuming 100 miles driven per rental day and converting it to pounds (lbs) of greenhouse gas emissions.
        kg:
          type: string
          description: The carbon footprint generated by travel activities measured in kilograms according to organisational calculation standards. For Air, Hotel, and Train, if carbon calculation method is BEIS/DEFRA, CO2 emissions are calculated by multiplying the distance travelled or nights stayed with a DEFRA (Department for Environment, Food & Rural Affairs) conversion coefficient. A new coefficient is released every year around July or August, which is used to convert air and train business travel and hotel stays into kilograms (kgs) of greenhouse gas emissions. Coefficient used for calculating CO2 emissions is of the same year as the travel start year. For Car, CO2 g/km emissions are computed based on average by category and fuel type using ACRISS calculation method assuming 100 miles driven per rental day and converting it to kilograms (kgs) of greenhouse gas emissions.
        lbs:
          type: string
          description: The carbon footprint generated by travel activities measured in pounds according to organisational calculation standards. For Air, Hotel, and Train, if carbon calculation method is BEIS/DEFRA, CO2 emissions are calculated by multiplying the distance travelled or nights stayed with a DEFRA (Department for Environment, Food & Rural Affairs) conversion coefficient. A new coefficient is released every year around July or August, which is used to convert air and train business travel and hotel stays into pounds (lbs) of greenhouse gas emissions. Coefficient used for calculating CO2 emissions is of the same year as the travel start year. For Car, CO2 g/km emissions are computed based on average by category and fuel type using ACRISS calculation method assuming 100 miles driven per rental day and converting it to pounds (lbs) of greenhouse gas emissions.
