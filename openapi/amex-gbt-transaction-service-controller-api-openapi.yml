          type: string
          description: The total amount associated with the leg in the report period.
        local_currency:
          type: string
          description: Indicates the local currency symbol for the booking.
        published_fare:
          type: string
          description: The published or undiscounted rate of the booking item.
        segment_amount:
          type: string
          description: The total amount associated with the segments (without tax)
        tax_gst:
          type: string
          description: The Goods and Services Tax charged for transaction. For purchases, this will be GST for the ticket. For exchanges, this will be the differential GST of the exchange. Federal tax currently set to 5%.
        tax_hst:
          type: string
          description: The Harmonized Sales Tax charged for transaction. For purchases, this will be HST for the ticket. For exchanges, this will be the differential HST of the exchange. Combination of federal and provincial tax used in provinces such as Ontario, New Brunswick, Nova Scotia, Newfoundland and Labrador, and PEI in Canada.
        tax_pst:
          type: string
          description: The Provincial Sales Tax charged for transaction. For purchases, this will be PST for the ticket. For exchanges, this will be the differential PST of the exchange. Only levied in some provinces such as British Columbia, Saskatchewan, Manitoba, and Quebec in Canada.
        tax_qst:
          type: string
          description: The Québec Sales Tax charged for transaction. For purchases, this will be QST for the ticket. For exchanges, this will be the differential QST of the exchange. Provincial sales tax charged on most goods and services in the province of Quebec, Canada.
        tax_vat:
          type: string
          description: The description added Tax charged with booking base amount.
        taxes:
          type: string
          description: Taxes for the current transaction (fees included for car)
        taxes_and_fees:
          type: string
          description: The taxes and fees associated with the current transaction.
        transaction_amount:
          type: string
          description: Total booking amount for the current transaction
        transaction_amount_local:
          type: string
          description: Indicates the gross booking amount in local currency, including taxes and fees.
        transaction_amount_vat:
          type: string
          description: Transaction Amount VAT
        true_ticket_amount:
          type: string
          description: The total ticket amount (including base and tax). This does not include any credits from a prior ticket or exchange penalties.
    Air_leg_details:
      description: Leg level detailed information
      properties:
        airline_alliance:
          type: string
          description: The airline alliance for a ticket, leg, or segment (leg and segment airline alliance may differ from the ticket airline alliance)
        cabin_class:
          type: string
          description: Indicates the highest travel class (economy, first, business, etc) of the ticket, leg, or segment at the time of booking.
        class_of_service:
          type: string
          description: The fare class (F, S etc.) associated with trains in the report period. The fare class indicates the cabin type as well as ticket or reservation restrictions.
        flown_cabin_class:
          type: string
          description: 'Indicates the actual cabin class offered by the airline to the traveler at the time of flight. It may be different from the ticketing cabin class if airline offered a complimentary cabin class upgrade. Cabin class is a segment-level attribute. To determine ticket or leg level cabin class, the cabin class of the segment with highest mileage (distance) is used. In case two or more segments have identical mileages, then segment is chosen based on the priority order of cabin class (i.e. level of service offered by the airline), which is in the following order: First class, business, premium economy, economy.'
        geography_type:
          type: string
          description: The region of travel (domestic, international, regional, etc.)
        leg_duration:
          type: string
          description: The total length of time (in minutes) from the flight departure time to flight arrival time. All segments and layover duration are included in the leg duration
        leg_number:
          type: string
          description: Represents the order of the leg within the ticket.
        marketing_airline:
          type: string
          description: The marketing airline associated with the air leg , e.g. Alaska Airlines or British Airways.
        number_of_segments:
          type: string
          description: The total number of segments
        origin_destination_info:
          $ref: '#/components/schemas/Air_origin_destination_details'
        price:
          $ref: '#/components/schemas/Price_information'
        travel_dates:
          $ref: '#/components/schemas/Air_dates_of_travel'
    Dynamic_Hotel_Rate_Cap:
      description: It is a dynamically calculated rate cap based on the Market Rate and customer policy settings. It is empty when the global or location-based rate cap (per diem) is used.
      properties:
        default_rate_cap:
          type: string
          description: The global or location based rate cap (per-diem) for a booking.
        dynamic_rate_cap:
          type: string
          description: A dynamically calculated rate cap based on the Market Rate and customer policy settings. Empty, when the global or location based rate cap (per-diem) is used.
        market_rate:
          type: string
          description: 'Median nightly rate for properties available in a destination at the time the search was performed. The market rate is determined by city level geography, so properties in the same search may have different values. Example: Seattle may have a market rate of $150, while nearby Bellevue has a market rate of $200.'
        market_rate_comparison:
          type: string
          description: 'Comparison of the nightly rate for the booking to the market rate. Example: A booking with $120 spend for one night with a Market Rate of $100 is 1.2 (120/100).'
        travel_policy_group_benchmark:
          type: string
          description: 'Comparison of booked historical nightly rates to market rates for the given travel policy group. 70 reference bookings are necessary to calculate this benchmark with high accuracy. Example: A policy group that has on average spent 50% more than the market rate will have a benchmark of 1.5.'
