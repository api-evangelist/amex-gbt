    Savings:
      description: Indicates the Total Savings
      properties:
        dynamic_rate_cap_savings:
          type: string
          description: Dynamic rate cap encourages travelers to book closer to the market rate. To determine how much it helps save, first a group of bookings (min 70) is used to find the percentage of how much travelers tend to book above or below the market median rate (i.e., Group benchmark). To determine savings for a booking, booked rate is multiplied by Group benchmark, and average nightly rate (i.e., market median rate) is subtracted from it for that booking (then multiply by room nights if more than one night per booking). In other words, if travelers usually book 10% above the market median rate but now they choose a rate (say, $100) which is 10% below market median rate of the search (say, $110), because the dynamic rate cap is active and is set at per diem, that's a 20% drop in spend (1.2 group benchmark). ($100 booked rate x 1.2) - ($110 market median rate) = $10 savings per night.
        egencia_preferred_rate_savings:
          type: string
          description: The difference between the ticketed fare and published fare when the ticketed fare was an Egencia Preferred Rates. The published fare refers to the price published by the same airline from which the ticket is booked. This metric only includes scenarios when the ticketed Egencia Preferred Rates and the published fare are a match (same airline, same flight, same routing, and as close as possible flexibility status (changeable, refundable, etc.).
        missed_savings:
          type: string
          description: The difference between the ticketed fare and the best fare option.Calculated for Online Purchases only
        negotiated_savings:
          type: string
          description: The difference between the ticketed fare and the published fare, if the ticketed fare was a negotiated rate.Calculated for corporate negotiated rates for air ticket purchases only. This does not include Egencia Preferred Rates.
        savings_over_published_fare:
          type: string
          description: This field shows the difference between the ticketed fare and the published fare. For example, if the ticketed fare is $350 and the published fare is $400, savings over published fare is $50.
        savings_over_published_rate:
          type: string
          description: Actual savings realized for Hotel as the difference between published rate and booked rate. For example, if the published rate is $100 and the booked rate is $80, savings over published rate is $20
