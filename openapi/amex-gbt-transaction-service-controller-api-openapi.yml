  /v1/transactions/{reportId}:
    get:
      description: "<p>Allows to retrieve multiple transactions for a specified search criteria in a paginated manner.</p>\n<p>List of the response attributes will vary based on the submitted query like lob, report level, etc.</p>\n</br>\n<p> Request Specifications: </p>\n<table class=\"fullWidth\">\n    <thead>\n    <tr>\n  <th>Attribute</th>\n  <th>Required</th>\n  <th>Type</th>\n  <th>Description</th>\n    </tr>\n    </thead>\n    <tbody>\n    <tr>\n  <td colspan=\"1\">\n   <strong>report_id</strong>\n  </td>\n  <td colspan=\"1\">Required</td>\n  <td colspan=\"1\">String</td>\n  <td colspan=\"1\">Report ID used to fetch transaction records based on the search criteria and metadata</td>\n    </tr>\n    <tr>\n  <td colspan=\"1\">\n   <strong>page_number</strong>\n  </td>\n  <td colspan=\"1\">Required</td>\n  <td colspan=\"1\">String</td>\n  <td colspan=\"1\">Page number the user wants to access</td>\n    </tr>\n    </tbody>\n</table>\n\n<b>Examples:</b></br>\n<a href = \"https://apis.egencia.com/bi/docs/api-response\">Sample Responses Here</a>\n</br>\n<p>This API will return all the qualified transactions inn a paginated manner by providing the data for current page and metadata (hyperlinks) of the previous and next pages.</p>"
      operationId: getTransactions
      parameters:
      - description: Unique report identifier returned from the POST /transactions response
        in: path
        name: reportId
        required: true
        schema:
          type: string
      - description: Page number to retrieve
        example: 1
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Transaction_response'
                - $ref: '#/components/schemas/Air_transaction_response'
                - $ref: '#/components/schemas/Train_transaction_response'
                - $ref: '#/components/schemas/Hotel_transaction_response'
                - $ref: '#/components/schemas/Fee_transaction_response'
                - $ref: '#/components/schemas/Car_transaction_response'
                - $ref: '#/components/schemas/Ground_transaction_response'
          description: <b>Found</b>.
        '400':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/EntityModelTransaction_Data_Response'
          description: '<b>Bad Request</b> : Invalid input or request'
        '401':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/EntityModelTransaction_Data_Response'
          description: '<b>Unauthorized</b> : <i>authentication token</i> empty, invalid or expired.'
        '403':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/EntityModelTransaction_Data_Response'
          description: '<b>Forbidden</b> : User not Validated for operation.'
        '422':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/EntityModelTransaction_Data_Response'
          description: '<b>Invalid input</b> : invalid or missing required input.'
        '500':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/EntityModelTransaction_Data_Response'
          description: '<b>Internal Server Error</b> : unable to process request'
      security:
      - OAuth2: []
      summary: Generates transaction data page response based on client provided filters
      tags:
      - transaction-service-controller
    servers:
    - url: https://apis.egencia.com/bi/api
      description: Generated server url
components:
  schemas:
    Fee_transaction_response:
      description: Transaction response based on different user filters for FEE LOB
      properties:
        Booker:
          $ref: '#/components/schemas/Booker_details'
        advance_purchase_days:
          type: string
          description: Number of days purchased in Advance
        advance_purchase_window:
          type: string
          description: The number of days before the travel start date that a traveler books a ticket or makes a reservation. This is usually depicted as a range of days. Includes purchase & reservations only
        ancillary_type:
          type: string
          description: The type of ancillary (Excess Baggage, Taxi, Shuttle, Parking, etc) associated with an Air or Train booking. It includes visas, insurance, additional services, air transportation, food, and seats.
        approval:
          $ref: '#/components/schemas/Approval_details'
        booking_category:
          type: string
          description: Booking Category of the transaction
        booking_method:
          type: string
          description: Online or Agent-assisted. Online indicates a booking made through the Egencia website or mobile app without the assistance of an Egencia travel consultant. Agent-assisted indicates bookings made offline with the assistance of an Egencia travel consultant.
        cabin_class:
          type: string
          description: Indicates the highest travel class (economy, first, business, etc) of the ticket, leg, or segment at the time of booking.
        class_of_service:
          type: string
          description: The fare class (F, S etc.) associated with trains in the report period. The fare class indicates the cabin type as well as ticket or reservation restrictions.
        client_code:
          type: string
          description: This is a Unique Identifier for a client in Egencia. In the current version, it will be corresponding to the GPID.
        co2:
          type: array
          description: Carbon Emission as per Air conversion factors (Source by DEFRA Produced by AEA for the Department of Energy and Climate Change (DECC) and the Department for Environment, Food and Rural Affairs (Defra))
          items:
            $ref: '#/components/schemas/Carbon_Emissions'
        company_name:
          type: string
          description: The name of the company travel was booked through
        custom_data_fields:
          type: object
          additionalProperties:
            type: object
            description: The custom fields set up by your company for reporting purposes that are either specified by the traveler at the time of booking or from the traveler profile.
          description: The custom fields set up by your company for reporting purposes that are either specified by the traveler at the time of booking or from the traveler profile.
        department:
          type: string
          description: The Department selected by the traveler at the time of booking
        distance:
          $ref: '#/components/schemas/Distance_Info'
        duration:
          $ref: '#/components/schemas/Duration_of_booking'
        fee_category:
          type: string
          description: Fee Global Type
        fee_count:
          type: string
          description: Fee(Ticket) Count
        fee_service_type:
          type: string
          description: Fee Service Type Name
        fee_type:
          type: string
          description: The fee type of the transaction
        feetype:
          type: string
          deprecated: true
          description: (Deprecated) Refer to fee_type
        geography_type:
          type: string
          description: The region of travel (domestic, international, regional, etc.).
        identifier:
          $ref: '#/components/schemas/Unique_transaction_identification_details'
        invoice_date:
          type: string
          description: The date the booking was invoiced. Invoice date is only applicable for European points of sale.
        is_active:
          type: string
          description: Indicates whether the Transaction/Ticket/Leg/Segment is Active or Inactive. A 'Yes' value indicates that the transaction is active, and a 'No' value indicates that the transaction has been cancelled, voided, refunded, or exchanged.
        is_special_request:
          type: string
          description: Indicates whether or not the ticket is a special request
        is_waived:
          type: string
          description: Indicates whether a fee transaction was waived by an agent
        last_modified_date:
          type: string
          description: Date and time when a particular record in reporting was last updated due to modifications after original purchase, back-dated data fixes, etc.
        line_of_business:
          type: string
          description: Line of business for the transaction, e.g. Air, Hotel, Car, Train, Ground
        location:
          type: string
          description: For hotels, this field shows the city, state/province and country where the hotel is located. For air and train, this field shows the routing information and for car, this field shows the pick-up location
        meeting_name:
          type: string
          description: Indicates meeting name associated with a booking (Meetings/Group Air Online or Group Trips). Applicable for Air, Hotel and Train in Group Trips, and only Air in Meetings. Empty for meetings outside of US and Canada.
        miscellaneous_transport_type:
          type: string
          description: Indicates the type of miscellaneous transport that the agent booked offline. It includes Car, Limo/town car (Ground), Ferry, Helicopter, Bus, High-speed craft, and Other.
        parent_client_code:
          type: string
