switchingCost:
  interfaceShape:
    value: standard-plus-proprietary
    standardsNamed:
      - name: SCIM 2.0 (System for Cross-domain Identity Management, RFC 7643 / RFC 7644)
        where: Egencia User Sync API - /scim/v1/users, /scim/v2/Users, /scim/v3/Users,
          plus /v2/Schemas discovery on the service-level definition
        status: implemented and load-bearing. Egencia's own api-info states the API
          "supports SCIM, or System for Cross-domain Identity Management, an open
          standard that allows automating user provisioning using REST API and JSON"
          and "follows version 2.0 of the SCIM protocol". Standard SCIM message
          schemas are used - urn:ietf:params:scim:api:messages:2.0:ListResponse and
          urn:ietf:params:scim:api:messages:2.0:Error - as is the standard enterprise
          extension urn:ietf:params:scim:schemas:extension:enterprise:2.0:User.
      - name: SCIM Egencia extension schema
        where: urn:ietf:params:scim:schemas:extension:egencia:2.0:User
        status: proprietary extension carrying companyId, singleSignOnId, arrangers,
          approvers and customDataFields. This is the vendor-specific half - the
          programme's actual configuration lives in attributes no other SCIM consumer
          understands.
      - name: OAuth 2.0 client credentials grant
        where: securitySchemes.OAuth2 in eleven of the thirteen contracts, tokenUrl
          https://apis.egencia.com/auth/v1/token, credentials passed as HTTP Basic
          base64(client_id:client_secret), token TTL returned as expires_in
        status: implemented; a standard authentication mechanism, which makes the
          client library portable but not the data model
      - name: OpenAPI 3.1.0
        where: all seventeen harvested definitions
        status: implemented, published anonymously, and machine-readable. This is the
          single best thing about Amex GBT's API posture.
      - name: HAL-style _links hypermedia
        where: Receipt SPI payload (_links.receipt.href) and BI transaction pagination
          metadata
        status: partially implemented as a response convention
    standardsAbsent:
      - IATA NDC - no NDC schema, no NDC endpoint, no certification level claimed
        anywhere. NDC appears only as the reporting attribute is_ndc.
      - OpenTravel / OTA XML or OTA 2.0 - no reference found in any of the seventeen
        contracts or any api-info document
      - HTNG - no reference found
      - IATA Resolution 787 / Offer-Order data model - no reference found
      - IATA ONE Order - no reference found
      - GIATA IDs for hotel property matching - no reference found; hotel_chain_code
        is present but no property-level industry identifier is
      - AsyncAPI, GraphQL - none published, despite three of the thirteen contracts
        being push/webhook SPIs that would be natural AsyncAPI candidates
    evidence: >-
      Eleven of the thirteen published contracts describe resources that exist only in
      Egencia's model - bookings and trip items keyed by Egencia IDs, custom data
      fields keyed by Egencia definition IDs, approval levels one and two, receipts,
      BI transaction reports. A consumer integrating against them writes code that
      cannot be repointed at BCD, CTM, Navan or Concur without a rewrite. The SCIM
      surface is the honourable exception, and it is the only place where a genuine
      open standard carries real weight.
  secondSource:
    value: alternatives-with-migration
    alternativesConsidered:
      - name: BCD Travel
        note: The nearest like-for-like global TMC. Same class of service, entirely
          different API surface.
      - name: CWT
        note: Was the obvious second source until Amex GBT completed its acquisition
          of CWT on 2 September 2025. One fewer independent alternative in the global
          multinational TMC tier - directly relevant to this assessment.
      - name: Corporate Travel Management (CTM)
        note: Global TMC with its own platform and integration surface.
      - name: Navan (formerly TripActions)
        note: The strongest software-first substitute for Egencia specifically, with a
          published API and a similar expense-plus-travel proposition.
      - name: TravelPerk
        note: SMB and mid-market substitute with its own API.
      - name: SAP Concur Travel
        note: Substitute for the booking and policy layer, and already the destination
          for many Egencia Expense SPI feeds - which cuts both ways, since a customer
          using Concur as the system of record is less locked in.
      - name: Direct GDS or NDC aggregation (Sabre, Amadeus, Travelport, Duffel, Kyte)
        note: Only viable for an organisation prepared to become its own agency,
          including IATA/ARC accreditation. Not a realistic swap for a corporate
          travel department.
    reasoning: >-
      Real alternatives exist in every tier, and the corporate travel management
      market is not a monopoly - so this is not few-alternatives and certainly not
      no-alternative. But nothing is a drop-in. Moving means renegotiating supplier and
      hotel programme agreements, changing agency of record and the IATA/ARC agency
      number attached to the programme, re-provisioning every traveller profile,
      re-modelling the entire custom-data-field taxonomy that carries cost-centre and
      project coding, rebuilding the approval hierarchy, rewriting the two or three
      SPI web services the customer hosts for validation, expense and approval
      customisation, and re-pointing the reporting warehouse at a different schema.
      The SCIM half of the work transfers; the other eleven contracts do not. That is
      the definition of alternatives-with-migration.
  exitPath:
    value: bulk-export-documented
    operationCited: POST https://apis.egencia.com/bi/api/v1/transactions - creates a
      filtered transaction report over a date range and returns pagination metadata;
      GET https://apis.egencia.com/bi/api/v1/transactions/{reportId} pages the result.
      Line-of-business variants at /v1/transactions/air, /hotel, /car, /train, /ground
      and /fees.
    detail: >-
      Egencia describes the BI Transactions API as a "generic and secure solution to
      allow clients to access their previous booking transaction data dynamically for
      different dates and other user query filters", covering all lines of business at
      summary level and air, hotel, car, train, ground and fee transactions
      individually, including air segment and ticketing detail and train segment and
      leg detail. This is a real, documented, self-service bulk export of the
      customer's own history - rare in this sector and the reason the exit path is
      recorded as bulk-export-documented rather than export-on-request.
    limits: >-
      It exports transactions, not configuration. There is no documented export of user
      profiles in bulk (SCIM supports GET /scim/v2/Users with filters and pagination,
      which is a workable substitute), no export of custom data field definitions
      beyond per-company GET, no export of approval hierarchies, and no documented
      archive of receipt or invoice documents in bulk. Egencia's own guidance also
      pushes consumers toward incremental daily pulls - "retrieve data for consecutive
      dates rather than fixed periods ... only retrieve historical data as necessary" -
      which is an operational constraint on a full historical extraction.
    gdprOperation: >-
      DELETE /gdpr?user_id={id} is published on every service-level definition -
      openconnect, bi, dutyofcare and company. It is an erasure operation, not a
      portability operation. It deletes a user's data; it does not hand it back.
      Recording it here so it is not mistaken for a data-portability endpoint. BI and
      Duty of Care additionally expose /v1/sensitive/audit/clean.
    accessCondition: The export requires live client credentials, which are revoked on
      account closure. A customer must run the export before the relationship ends,
      not after.
  identifierPortability:
    value: portable PNR/record locator, IATA agency and carrier codes and hotel chain
      codes travel; Egencia itinerary, booking, item, company, traveller and CDF keys
      do not
    portable:
      - name: pnr
        source: BI Transactions API, schema "Unique transaction identification details"
        definition: '"The booking reference code provided by the vendor. Also known as
          a PNR (passenger name record) code. This is typically a 6 character reference
          code"'
      - name: record_locator
        source: same schema
        definition: identical definition to pnr - the supplier-side booking reference
      - name: confirmation_number
        source: same schema
        definition: '"A unique number generated by supplier that identifies the
          booking."'
      - name: ticket_code (ticket_number deprecated in its favour)
        source: same schema, and Train segment details
      - name: IATA agency code by point of sale
        source: GET https://apis.egencia.com/bi/api/v1/egencia_iata, schema "IATA Code
          response" with properties iata and pos
        definition: '"IATA Code for the particular Point of Sale" - the agency
          accreditation number attached to the programme in each market'
      - name: marketing_airline, operating_carrier_segment, ticketing_carrier,
          carrier_code, airline_alliance, low_cost_carrier
        source: Air transaction and Air segment schemas - IATA airline designators
      - name: hotel_chain_code
        source: Hotel transaction response - '"The chain code associated with the
          hotel."' Chain-level only; no GIATA or property-level industry ID is exposed.
      - name: invoice_number
        source: '"The invoice number associated with the travel transaction being
          reported on."'
    nonPortable:
      - name: itinerary_number
        note: '"The Egencia itinerary number associated with the travel transaction
          being reported on." Egencia''s own key, explicitly labelled as such.'
      - name: booking_id and item_id
        note: The primary keys of every booking, approval, cancellation and receipt
          operation. Example from the published Receipt SPI payload - booking_id
          "8000-2573-464", item_id "86a508692d9282afa0d96e5f6af".
      - name: company_id and organization_parent_id
        note: Egencia account keys, required path parameters on the CDF API and present
          in every SPI payload.
      - name: traveler_id and SCIM userId
        note: Egencia-issued user keys. The SCIM extension also carries singleSignOnId,
          which is customer-controlled and therefore more portable.
      - name: CDF definitionId and valueId
        note: The keys under which a customer's own cost-centre, project-code and
          reason-for-travel taxonomy is stored. This is the customer's data in
          Egencia's namespace.
      - name: resourceId / reportId
        note: Opaque UUIDs for Duty of Care and BI pagination resources.
    reading: >-
      The reporting layer was designed to be handed to a third party - it speaks the
      industry's identifiers. The transactional layer was designed to be operated by
      Egencia - it speaks Egencia's. A departing customer keeps its booking history in
      a form a successor TMC can read; it does not keep its programme configuration.
  contractualLockIn:
    value: no minimum term, exclusivity, fee schedule or termination notice is
      published; Egencia reserves unilateral amendment of the API terms and imposes
      the upgrade timetable
    verbatim:
      - source: https://apis.egencia.com/bi/docs/api-docs/transaction-data-service
          (OpenAPI info.description, "Terms & Conditions")
        clause: unilateral amendment
        text: >-
          "By accepting the terms and conditions, you acknowledge and agree that
          Egencia have the right, in its sole discretion, to modify these terms.
          Egencia will notify you about material changes to this Agreement by sending a
          notice to the email address, fax number, or other address that you provided
          to us or by placing a prominent notice on the APIs and SPIs. Customers will be
          responsible for reviewing and becoming familiar with any such modifications."
      - source: same
        clause: version upgrade obligation
        text: >-
          "Egencia will notify Consumer and Shared Client of the availability of new
          major versions and provide the timeframe for the Consumer to upgrade."
      - source: same
        clause: copyright over the documentation itself
        text: >-
          "All details on this document are copyrighted and are protected by Egencia
          copyright laws. Any unauthorized use of any part of this document may violate
          copyright laws and may lead to legal actions."
      - source: same, "Versioning"
        clause: breaking-change scope
        text: >-
          "Egencia will release new version of the software with backward compatibility
          only when there is significant change(s). These changes can be structural, and
          can contain enhancements, major bug fixes, or change of behavior, endpoint
          changes, new fields added, or fields removed."
      - source: https://apis.egencia.com/bi/v1/api-info
        clause: credential issue is conditional on onboarding
        text: >-
          "The values for client id and client secret will be provided to the Client
          after on-boarding to Egencia API platform."
    notPublished:
      - minimum term or commitment period
      - exclusivity or full-content clause
      - per-transaction, per-segment or per-call fees, and API pricing of any kind
      - termination notice period
      - revocation-on-account-closure language (though credentials are plainly tied to
        an active client relationship)
      - rate limits or quotas - the BI documentation announces a "rate limits" section
        that is never actually populated with numbers
      - service level agreement or uptime commitment
      - deprecation policy with dated sunset windows
      - an acceptable use policy or data licence for API responses
    reading: >-
      The real commercial terms of an Amex GBT or Egencia relationship live in the
      negotiated master services agreement, which is not published and cannot be cited.
      What IS published is a short terms block embedded in the OpenAPI documents
      themselves, and it is one-sided in the ordinary way - Egencia may change the
      terms at its sole discretion and sets the timetable on which the customer must
      upgrade. Nothing verifiable was found about minimum terms, exclusivity or
      termination, and nothing has been inferred.
  distributionModel:
    value: aggregator-reseller
    detail: >-
      Amex GBT is a travel management company - the buy-side intermediary. It does not
      own inventory. It aggregates supplier content and resells it to corporate travel
      programmes with policy, approval, duty-of-care, expense and reporting layered on
      top, and it earns transaction fees and supplier commissions rather than fares.
      Its own air content is GDS-intermediated in the classic way, which the published
      schemas make plain - PNR and record locator, marketing, operating and ticketing
      carrier codes, ticket codes, and an IATA agency number per point of sale
      retrievable from GET /v1/egencia_iata. The APIs it publishes are not distribution
      APIs at all - there is no shopping, offer, pricing, order, fulfilment or ticketing
      endpoint anywhere in the estate. Booking happens in Egencia's own web checkout;
      the APIs govern who may book, under what codes, and what data comes back
      afterwards.
    ndcPosture: >-
      No NDC certification level is claimed and no NDC API is published - which is the
      expected posture for an agency rather than a carrier, since IATA NDC certification
      applies to airlines and to aggregators/IT providers, not to a TMC's own corporate
      API. NDC appears exactly once in the entire published surface, in the BI
      Transactions API, as the schema "NDC (New Distribution Capability) Details" with a
      single string property is_ndc - "Indicates whether an air booking was done via NDC
      (New Distribution Capability) or not". Amex GBT therefore consumes NDC content and
      reports on it, and gives its corporate customers the ability to distinguish
      NDC-sourced air spend from GDS-sourced air spend in their own reporting. Nothing
      published states whether GDS bookings carry a surcharge; no fee schedule of any
      kind is published.
    productFamiliesRepresented: >-
      Egencia's own segmentation, faithfully reproduced in apis.yml, is six families -
      User Interface (User Sync, Context SSO), Data Customisation (Company Info, Company
      CDF, Validation SPI), Booking Details (Expense SPI, Booking API, Cancellation and
      Deletion), Approval Workflows (Approval API, Approval Customisation SPI, Receipts),
      Duty of Care, and Data Reporting. Note what is absent relative to a distribution
      platform - no search/shopping, no offers and pricing, no order creation, no
      payment, no fulfilment or ticketing, no loyalty, no content and imagery, no
      availability and rates. Amex GBT does not expose the booking funnel over an API at
      all.
  accessGate:
    value: customer-account-required
    developerMustSign: >-
      There is no signup form, no sandbox key and no interactive try-it anywhere. The
      published documentation and the seventeen OpenAPI contracts are fully public and
      anonymous - a prospective integrator can read and code-generate against the entire
      surface before committing, which is genuinely good. But to call anything, a
      developer must be, or be working on behalf of, an onboarded Egencia corporate
      client or contracted partner. Egencia states it directly in the BI API
      documentation - "The values for client id and client secret will be provided to
      the Client after on-boarding to Egencia API platform." Those credentials are then
      exchanged for a bearer token at https://apis.egencia.com/auth/v1/token using the
      OAuth 2.0 client credentials grant with HTTP Basic
      base64(client_id:client_secret); tokens expire and must be renewed, with the BI
      guidance noting a one-hour lifetime. No IATA or ARC accreditation is required of
      the developer - Amex GBT holds the accreditation, which is precisely the service
      being sold - so this is a commercial customer gate, not an
      accredited-or-licensed gate.
    portalConfirmed: false
    portalUrl: https://www.amexglobalbusinesstravel.com/egencia-developer-center/
    portalNote: >-
      The Egencia Developer Center is real, is Amex GBT's own property, and is the
      canonical home of this API programme - its catalogue feed, its api-info documents
      and its OpenAPI definitions were all retrieved live. It is recorded as not
      confirmed for two independent reasons. First, every HTML page on
      amexglobalbusinesstravel.com and egencia.com returns HTTP 403 from Cloudflare to
      any automated client, so no 200 could be obtained from the portal itself. Second,
      and more importantly, it is not a self-serve portal - there is no registration,
      no key issue and no sandbox available without an Egencia commercial relationship.
      developer.egencia.com redirects to /login, which is a partner login shell, exactly
      the case the confirmation test is meant to exclude.
  agentReadiness:
    llmsTxt: not confirmable - /llms.txt returns 403 from the Cloudflare gate on both
      www.amexglobalbusinesstravel.com and www.egencia.com rather than a clean 404
    mcp: none published
    note: >-
      Seventeen valid OpenAPI 3.1.0 documents retrievable anonymously means an agent or
      code generator can be built against this surface without any prior relationship -
      which is a materially better agent-readiness position than most travel
      intermediaries. What blocks an agent is the runtime credential, not the contract.
      No machine-readable terms, rate limits or scopes are published, so an agent cannot
      check what it is allowed to do before calling.
