  humanUrlDerivation: >-
    The per-API humanURL values follow the pattern
    https://www.amexglobalbusinesstravel.com/egencia-developer-center/api-details/{id},
    where {id} is taken verbatim from Egencia's own api-summaries catalogue feed. The
    pattern itself is corroborated by an independently indexed live page for the Duty
    of Care API at .../egencia-developer-center/api-details/doc-api. The pages could
    not be individually confirmed with a 200 because Cloudflare blocks every automated
    client on that host. Recorded here so the derivation is auditable.
  reason: |
    Thirteen APIs are listed because Egencia's own developer center catalogue names
    twelve, and a thirteenth - the Approval Customisation SPI - has its own published
    OpenAPI contract at https://apis.egencia.com/approval/docs/api-docs even though the
    captured feed groups it under Approval Workflows. Every one of the thirteen has a
    real, anonymously retrievable, parsing OpenAPI 3.1.0 definition, so all thirteen
    clear the bar of real AND documented AND machine-readable.

    Four additional service-level definitions (openconnect, bi, dutyofcare, company)
    are saved and referenced under common[] rather than as separate APIs. They are the
    same operations viewed per deployed service rather than per product, plus the
    infrastructure operations - /gdpr erasure, /base/liveness, /base/readiness,
    /base/version, /v1/sensitive/audit/clean, /scim/v1/admin-users, /v1/resolve and
    /v2/Schemas - that Egencia does not present as products. They are recorded because
    the /gdpr operation is material to the exit-path assessment and because they are
    the only place several operations appear at all.

    The apis-us-west-2.lab.egencia.cloud and apis-eu-west-1.lab.egencia.cloud sandbox
    hosts are deliberately NOT listed as APIs. They are real and live, but they are
    environments of the same contracts rather than distinct APIs, and Egencia does not
    document them publicly - the host name came from a third-party Postman workspace.

    No Amex GBT-branded API is listed separately because none exists. apitools.amexgbt.com
    is NXDOMAIN and developer.amexgbt.com serves no obtainable content. The entire
    published API programme of American Express Global Business Travel is the Egencia
    platform.
