aid: amex-gbt
name: American Express Global Business Travel
review:
  question: Does American Express Global Business Travel publish a public developer
    surface, documented APIs and machine-readable API contracts - and what would it
    cost a corporate travel programme to leave?
  answer: true
  date: '2026-07-28'
  reviewer: API Evangelist
  method: direct HTTP probing of amexglobalbusinesstravel.com, amexgbt.com,
    egencia.com, apis.egencia.com, apis-us-west-2.lab.egencia.cloud and candidate
    developer/api/docs subdomains; recovery of the developer center's own
    api-summaries feed; anonymous harvest and parse of every OpenAPI document it
    points at; retrieval of the public Egencia Postman workspace via the Postman
    public collection API; DNS resolution checks; GitHub organisation checks
findings:
  summary: |
    Amex GBT is a travel management company - the intermediary layer of the travel
    distribution chain, not a supplier of inventory. It aggregates air, hotel, rail,
    car and ground content sourced through the GDS layer, through NDC and through
    direct supplier connections, and resells it to corporate travel programmes with
    policy, approval, duty-of-care, expense and reporting wrapped around it. NYSE
    GBTG, headquartered in New York, operating in more than 140 countries, with
    Egencia acquired May 2021, Ovation January 2021, Hogg Robinson Group February
    2018 and CWT completed 2 September 2025.

    The company's API programme is entirely the Egencia platform. There is no separate
    Amex GBT developer portal. apitools.amexgbt.com, which older search indexes
    describe as an Amex GBT developer portal, does not resolve at all (NXDOMAIN on
    2026-07-28) - it is dead. developer.amexgbt.com and api.amexgbt.com resolve to
    Cloudflare but return 403 to every automated client.

    Everything on the amexglobalbusinesstravel.com and egencia.com web properties is
    behind Cloudflare bot protection and returns HTTP 403 to curl, to WebFetch and to
    a reader proxy alike - including robots.txt, llms.txt and the developer center
    itself. That is a browser-only gate, not an authentication gate. It means the
    human-facing developer center could not be confirmed with a 200, and it is the
    reason portalConfirmed is recorded false.

    The technical surface behind it, however, is wide open. The developer center is a
    thin client over a JSON content service, and that service is served from
    apis.egencia.com, which is NOT behind the same bot gate. Recovering the developer
    center's own catalogue feed (/developer-center/v1/api-summaries) produced a list
    of six API families and twelve named APIs. Every documentation_link in that feed
    resolves anonymously, with no key and no click-through, to either a rich JSON
    api-info document or - following one more hop - a complete OpenAPI 3.1.0
    definition. Thirteen product-level OpenAPI documents and four service-level
    OpenAPI documents were harvested this way, all HTTP 200, all valid JSON, all
    parsing cleanly. That is an unusually good machine-readable posture for a
    corporate travel intermediary, and it is almost certainly unintentional: the
    Cloudflare policy that blocks the marketing site was never applied to the API
    gateway that serves the docs.

    The runtime is a different story. Every production endpoint probed anonymously -
    /openconnect/api/scim/v2/Users, /bi/api/v1/transactions, /dutyofcare/api/v1/bookings,
    /bi/api/base/version - returns HTTP 401. Authentication is OAuth 2.0 client
    credentials against https://apis.egencia.com/auth/v1/token, and the BI API's own
    documentation states the gate in plain words: "The values for client id and client
    secret will be provided to the Client after on-boarding to Egencia API platform."
    There is no self-serve signup, no sandbox key, no interactive try-it. The
    sandbox that exists - apis-us-west-2.lab.egencia.cloud, discovered in the public
    Egencia Postman workspace - is live and returns 401 to unauthenticated callers.

    On the switching-cost question the picture is genuinely mixed, and that is the
    finding. The identity surface is a real open standard: the User Sync API is SCIM
    2.0 across three concurrent versions, with SCIM ListResponse and Error message
    schemas, a /v2/Schemas discovery endpoint, and standard filter syntax. A customer
    who provisions travellers into Egencia over SCIM has done work that transfers to
    any other SCIM consumer. But it is SCIM plus an Egencia extension -
    urn:ietf:params:scim:schemas:extension:egencia:2.0:User carrying companyId,
    singleSignOnId, arrangers, approvers and customDataFields - and the extension is
    where the programme's actual configuration lives.

    Everything else is proprietary. The booking, approval, cancellation, receipt,
    expense, validation, duty-of-care and reporting contracts are bespoke Egencia
    shapes. There is no OpenTravel/OTA message, no HTNG interface, no IATA NDC schema
    and no NDC endpoint anywhere in the estate. NDC appears exactly once, as a boolean
    reporting attribute: the schema "NDC (New Distribution Capability) Details" with a
    single property is_ndc, described as "Indicates whether an air booking was done via
    NDC (New Distribution Capability) or not". That is the whole NDC posture - Amex GBT
    consumes NDC content as a TMC and flags it in reporting; it publishes no NDC API of
    its own, and none would be expected of an agency rather than a carrier.

    Three of the thirteen contracts are SPIs rather than APIs - Validation, Expense and
    Approval Customisation - meaning Egencia calls the customer, and the customer must
    build and host the web service. An SPI raises switching cost even when the contract
    is published openly, because the integration asset is code the customer wrote to
    Egencia's shape and cannot repoint at a competitor.

    The exit path is better than most of this sector. The BI Transactions API is a
    genuine, documented bulk export of the customer's own transaction history: POST
    /v1/transactions with a date range and filters returns pagination metadata, and GET
    /v1/transactions/{reportId} pages through it, across air, hotel, car, train, ground
    and fee lines of business with segment, leg and ticketing detail. The response
    schemas carry the portable industry keys - pnr, record_locator, marketing_airline,
    operating_carrier, ticketing_carrier, hotel_chain_code, ticket_code,
    confirmation_number, invoice_number - so a departing customer can carry its
    booking history to a successor TMC in industry terms rather than Egencia terms.
    Separately, every service exposes DELETE /gdpr?user_id=, a per-user erasure
    operation. That is a deletion right, not a portability right, and it should not be
    mistaken for one.

    What does not travel is the programme configuration: Egencia company_id,
    traveler_id, booking_id, item_id, itinerary_number, CDF definition and value IDs,
    the SCIM userId, and the approval hierarchy modelled in the Egencia extension
    schema. Rebuilding those against a successor platform is the migration project.
