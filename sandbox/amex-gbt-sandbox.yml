  no test identifiers, no fixture triggers, no time simulation. The company IDs, booking IDs and
  traveller names that appear in the published examples are illustrative sample payloads, not
  callable fixtures, and are recorded below strictly as documentation examples so a future round
  does not mistake them for working test data.
